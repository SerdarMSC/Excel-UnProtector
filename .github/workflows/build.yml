name: Build Excel Unprotector

# Ne zaman calisir:
#  - main/master'a her push ve her pull request'te (derleme dogrulamasi)
#  - "v1.0.0" gibi bir surum etiketi (tag) push edildiginde (ayrica GitHub Release'e .exe ekler)
#  - Actions sekmesinden elle tetiklendiginde ("Run workflow")
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write   # tag push'ta Release olusturup dosya eklemek icin gerekli

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "ExcelUnprotector/ExcelUnprotector.csproj"
  # WinForms icin derleme, calistirmayi test etmeyecegimiz icin sadece windows-latest gerekiyor.

jobs:
  build:
    name: Build & Publish
    # WinForms uygulamasi oldugundan Windows runner sart.
    runs-on: windows-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Bagimliliklari geri yukle (restore)
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Derle (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      # KUCUK CIKTI (onerilen): .NET calisma zamanini gomulmez, birkac yuz KB'dir.
      # Calistiran makinede ".NET 8 Desktop Runtime" kurulu olmali; degilse Windows
      # ilk calistirmada otomatik kurulum sayfasina yonlendirir.
      - name: Kucuk .exe olustur - framework-dependent (Desktop Runtime gerektirir)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish-slim

      # BUYUK CIKTI (taşınabilir): .NET calisma zamani exe'nin icine gomulur, hedef
      # makinede hicbir sey kurulu olmasa da calisir. EnableCompressionInSingleFile
      # boyutu onemli olcude kucultur (WinForms'ta trimming guvenli olmadigi icin
      # kullanilmiyor).
      - name: Tasinabilir .exe olustur - self-contained (kurulum gerektirmez)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish-full

      - name: Kucuk ciktiyi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ExcelUnprotector-win-x64-slim
          path: publish-slim/ExcelUnprotector.exe
          if-no-files-found: error

      - name: Tasinabilir ciktiyi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ExcelUnprotector-win-x64-portable
          path: publish-full/ExcelUnprotector.exe
          if-no-files-found: error

      - name: Surum etiketiyse dosyalari isimlendirerek hazirla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item publish-slim/ExcelUnprotector.exe ExcelUnprotector-slim.exe
          Copy-Item publish-full/ExcelUnprotector.exe ExcelUnprotector-portable.exe

      - name: Isimlendirilmis dosyalari GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ExcelUnprotector-slim.exe
            ExcelUnprotector-portable.exe
