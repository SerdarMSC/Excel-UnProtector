name: Build Excel Unprotector

# Ne zaman calisir:
#  - main/master'a her push ve her pull request'te (derleme dogrulamasi)
#  - "v1.0.0" gibi bir surum etiketi (tag) push edildiginde (ayrica GitHub Release'e .exe ekler)
#  - Actions sekmesinden elle tetiklendiginde ("Run workflow")
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write   # tag push'ta Release olusturup dosya eklemek icin gerekli

env:
  PROJECT_PATH: "ExcelUnprotector/ExcelUnprotector.csproj"
  BUILD_OUTPUT: "ExcelUnprotector/bin/Release/net48"

jobs:
  build:
    name: Build
    # .NET Framework 4.8 hedeflendigi ve WinForms kullanildigi icin Windows runner sart.
    # windows-latest imajinda .NET Framework 4.8 targeting pack ve gerekli MSBuild
    # bilesenleri onceden kuruludur.
    runs-on: windows-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          # Derleme araci (dotnet CLI) icin bir SDK gerekiyor; hedef framework (net48)
          # bundan bagimsizdir - SDK, net48 icin gerekli targeting pack'i makinede bulup
          # kullanir.
          dotnet-version: "8.0.x"

      - name: Bagimliliklari geri yukle (restore)
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Derle (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Cikti dosyalarini listele (tanilama amacli)
        shell: pwsh
        run: Get-ChildItem "${{ env.BUILD_OUTPUT }}"

      - name: .exe'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ExcelUnprotector-net48
          # .NET Framework derlemesi tamamen framework-dependent oldugundan (GAC'taki
          # System.* derlemelerini kullanir) sadece .exe (ve varsa .exe.config) yeterlidir;
          # ekstra bir "publish" veya self-contained adima gerek yoktur.
          path: |
            ${{ env.BUILD_OUTPUT }}/ExcelUnprotector.exe
            ${{ env.BUILD_OUTPUT }}/ExcelUnprotector.exe.config
          if-no-files-found: error

      - name: Surum etiketiyse GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.BUILD_OUTPUT }}/ExcelUnprotector.exe
